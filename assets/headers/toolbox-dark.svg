<svg xmlns="http://www.w3.org/2000/svg" width="880" height="56" viewBox="0 0 880 56" role="img" aria-label="03 Toolbox"><title>03 Toolbox</title><defs><style>@font-face{font-family:'Inter';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Inter';font-weight:500;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Inter';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}.sans{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.serif{font-family:'Crimson Text',Georgia,'Times New Roman',serif}.mono{font-family:'DejaVu Sans Mono',ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(6px)}}.fade{animation:fadein 1.1s ease both}@keyframes fadein{from{opacity:0}}.draw{stroke-dasharray:100;animation:drawin 1.3s cubic-bezier(.6,0,.2,1) both}@keyframes drawin{from{stroke-dashoffset:100}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><text x="2" y="34" class="sans" font-size="13" font-weight="500" fill="#C9A35B">03</text><text x="30" y="35" class="sans" font-size="22" font-weight="600" fill="#E6E8EE">Toolbox</text><path class="draw" style="animation-delay:.15s" pathLength="100" d="M129.4 27.5H745.8" stroke="#232B38"/><text x="878" y="32" text-anchor="end" class="sans" font-size="12" fill="#6B7385">what I build with</text></svg>
