<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Animated backend request lifecycle: client, API, auth, cache, database">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a2e"/><stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .nt { font: 700 20px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .ns { font: 500 13px 'Fira Code', Consolas, 'Courier New', monospace; fill: #8fb4ff; }
    .hd { font: 600 13px 'Fira Code', Consolas, 'Courier New', monospace; fill: #cbb58e; letter-spacing: 3px; }
    .req { font: 600 14px 'Fira Code', Consolas, 'Courier New', monospace; fill: #e3d1aa; }
    .res { font: 600 14px 'Fira Code', Consolas, 'Courier New', monospace; fill: #c6a56b; }
    .flowf { animation: dashf 1.2s linear infinite; }
    .flowb { animation: dashb 1.2s linear infinite; }
    @keyframes dashf { to { stroke-dashoffset: -24; } }
    @keyframes dashb { to { stroke-dashoffset: 24; } }
  </style>
  <rect x="1" y="1" width="1198" height="318" rx="24" fill="url(#bg)" stroke="#b9955b" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="40" y="48" class="hd">REQUEST LIFECYCLE</text>
  <text x="1160" y="48" class="hd" text-anchor="end" style="fill:#c6a56b">how I think about APIs</text>

  <path d="M120 134 H1080" fill="none" stroke="#e3d1aa" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="6 6" class="flowf"/>
  <path d="M1080 176 C1080 280 120 280 120 176" fill="none" stroke="#c6a56b" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="6 6" class="flowb"/>
  
    <g>
      <rect x="52" y="92" width="136" height="84" rx="16" fill="#0a1450" stroke="#e3d1aa" stroke-opacity="0.35" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.18;1" dur="4.0s" begin="0.00s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#14307a;#0a1450;#0a1450" keyTimes="0;0.18;1" dur="4.0s" begin="0.00s" repeatCount="indefinite"/>
      </rect>
      <text x="120" y="128" text-anchor="middle" class="nt">Client</text>
      <text x="120" y="152" text-anchor="middle" class="ns">browser / app</text>
    </g>
    <g>
      <rect x="292" y="92" width="136" height="84" rx="16" fill="#0a1450" stroke="#e3d1aa" stroke-opacity="0.35" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.18;1" dur="4.0s" begin="1.00s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#14307a;#0a1450;#0a1450" keyTimes="0;0.18;1" dur="4.0s" begin="1.00s" repeatCount="indefinite"/>
      </rect>
      <text x="360" y="128" text-anchor="middle" class="nt">API</text>
      <text x="360" y="152" text-anchor="middle" class="ns">FastAPI / Flask</text>
    </g>
    <g>
      <rect x="532" y="92" width="136" height="84" rx="16" fill="#0a1450" stroke="#e3d1aa" stroke-opacity="0.35" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.18;1" dur="4.0s" begin="2.00s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#14307a;#0a1450;#0a1450" keyTimes="0;0.18;1" dur="4.0s" begin="2.00s" repeatCount="indefinite"/>
      </rect>
      <text x="600" y="128" text-anchor="middle" class="nt">Auth</text>
      <text x="600" y="152" text-anchor="middle" class="ns">JWT / bcrypt</text>
    </g>
    <g>
      <rect x="772" y="92" width="136" height="84" rx="16" fill="#0a1450" stroke="#e3d1aa" stroke-opacity="0.35" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.18;1" dur="4.0s" begin="3.00s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#14307a;#0a1450;#0a1450" keyTimes="0;0.18;1" dur="4.0s" begin="3.00s" repeatCount="indefinite"/>
      </rect>
      <text x="840" y="128" text-anchor="middle" class="nt">Cache</text>
      <text x="840" y="152" text-anchor="middle" class="ns">Redis</text>
    </g>
    <g>
      <rect x="1012" y="92" width="136" height="84" rx="16" fill="#0a1450" stroke="#e3d1aa" stroke-opacity="0.35" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.18;1" dur="4.0s" begin="4.00s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#14307a;#0a1450;#0a1450" keyTimes="0;0.18;1" dur="4.0s" begin="4.00s" repeatCount="indefinite"/>
      </rect>
      <text x="1080" y="128" text-anchor="middle" class="nt">Database</text>
      <text x="1080" y="152" text-anchor="middle" class="ns">PostgreSQL</text>
    </g>

  <text x="600.0" y="82" text-anchor="middle" class="req">request  &#8594;</text>
  <text x="600.0" y="268" text-anchor="middle" class="res">&#8592;  200 OK  ·  JSON response</text>

  <circle r="7" fill="#e3d1aa" filter="url(#g)"><animateMotion dur="4.0s" repeatCount="indefinite" path="M120 134 H1080"/></circle>
  <circle r="4" fill="#9be8ff" opacity="0.8"><animateMotion dur="4.0s" begin="0.3s" repeatCount="indefinite" path="M120 134 H1080"/></circle>
  <circle r="7" fill="#c6a56b" filter="url(#g)"><animateMotion dur="4.0s" begin="2.0s" repeatCount="indefinite" path="M1080 176 C1080 280 120 280 120 176"/></circle>
  <circle r="4" fill="#a7f3d0" opacity="0.8"><animateMotion dur="4.0s" begin="2.3s" repeatCount="indefinite" path="M1080 176 C1080 280 120 280 120 176"/></circle>
</svg>
