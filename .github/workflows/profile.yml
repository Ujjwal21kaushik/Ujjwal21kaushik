name: Update profile

on:
  workflow_dispatch:          # run by hand from the Actions tab
  schedule:
    - cron: "0 */6 * * *"     # and every 6 hours
  push:
    paths:
      - "assets/photo.*"      # redraw the ASCII portrait when you change your photo

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build live cards (about, LeetCode, contribution header)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_live.py

      - name: Build 3D contribution skyline
        if: always()
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live profile-3d-contrib
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git pull --rebase --autostash
            git push
          fi
