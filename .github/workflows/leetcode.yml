name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate LeetCode card
        env:
          LEETCODE_USERNAME: ueMXf7R1D6
        run: python scripts/leetcode_card.py

      - name: Generate GitHub stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Ujjwal21kaushik
        run: python scripts/github_stats.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-card.svg assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "No card changes to commit."
          else
            git commit -m "chore: update profile cards [skip ci]"
            git push
          fi
