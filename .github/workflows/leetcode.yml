name: Update LeetCode card

on:
  workflow_dispatch:        # run manually from the Actions tab
  schedule:
    - cron: "0 */6 * * *"   # and automatically every 6 hours

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate LeetCode card
        env:
          LEETCODE_USERNAME: ueMXf7R1D6
        run: python scripts/leetcode_card.py

      - name: Commit card if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-card.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update LeetCode card [skip ci]"
            git push
          fi
